    <!-- Immediate Static Splash Screen (Visible before React hydration) -->
    <div id="foyc-static-splash" style="position:fixed;inset:0;z-index:9999999;background-color:#B8E986;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s ease-in-out;">

        <div style="background-color:#ffffff;border:3px solid #17172B;border-radius:28px;box-shadow:8px 8px 0px #17172B;padding:28px 44px;margin-bottom:24px;">

      </div>
    </div>
    <style>
      @keyframes foycStaticProgress {

        50% { width: 70%; margin-left: 15%; }
        100% { width: 100%; margin-left: 0%; }
      }
    </style>
